name: Apex CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Forcing web3 installation ensures the Web3 class is available
        pip install web3>=6.0.0 pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest
      env:
        # Mounts the root directory to sys.path to fix the 'src' module error
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v
