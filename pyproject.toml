[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-agent"
version = "0.1.0"
dependencies = [
    "pytest",
    "fastapi",
    "pydantic",
    "httpx"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
